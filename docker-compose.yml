services:

  # ============================================================
  # BASE DE DATOS - MYSQL LOCAL (se conserva, pero no se usa)
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: docker-tp-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docker_tp}
      MYSQL_USER: ${MYSQL_USER:-docker_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-docker_password}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-local_root_password}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - docker_tp_network


  # ============================================================
  # BACKEND - FASTAPI CON TIDB CLOUD
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: docker-tp-backend

    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT:-4000}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docker_tp}

      SENTRY_DSN: ${SENTRY_DSN}

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    networks:
      - docker_tp_network


  # ============================================================
  # FRONTEND - NGINX
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: docker-tp-frontend

    depends_on:
      - backend

    ports:
      - "${FRONTEND_PORT:-80}:80"

    networks:
      - docker_tp_network


# ============================================================
# VOLUMEN
# ============================================================
volumes:
  mysql_data:


# ============================================================
# RED
# ============================================================
networks:
  docker_tp_network:
    driver: bridge
