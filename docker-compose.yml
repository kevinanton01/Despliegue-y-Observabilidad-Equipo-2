services:

  mysql:
    image: mysql:8.0
    container_name: docker-tp-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: docker_tp
      MYSQL_USER: docker_user
      MYSQL_PASSWORD: docker_password

    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - docker_tp_network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: docker-tp-backend

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8000:8000"

    networks:
      - docker_tp_network


  frontend:
    image: nginx:alpine

    container_name: docker-tp-frontend

    depends_on:
      - backend

    ports:
      - "80:80"

    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - docker_tp_network


volumes:
  mysql_data:


networks:
  docker_tp_network:
    driver: bridge